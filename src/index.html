<body>
<div class="app">
<aside class="side">
  <div class="brand"><span class="logo">🏠</span><div><h1 id="appTitle">Мой прогресс</h1><div class="bsub">Будь внимательной. Будь последовательной. Будь собой.</div></div></div>
  <nav class="tabs" id="tabs" aria-label="Разделы"><button class="tab " onclick="go(&#39;overview&#39;)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path></svg> Обзор</button><button class="tab active" onclick="go(&#39;tyeww8e&#39;)"><span class="tdot" style="background:var(--a-rose)"></span>Спорт / Тело</button><button class="tab " onclick="go(&#39;f3r7wya&#39;)"><span class="tdot" style="background:var(--a-blue)"></span>Дизайн и карьера</button><button class="tab " onclick="go(&#39;nqfg6ex&#39;)"><span class="tdot" style="background:var(--a-green)"></span>Английский</button><button class="tab " onclick="go(&#39;h88uri5&#39;)"><span class="tdot" style="background:var(--a-violet)"></span>Понедельник</button><button class="tab add" onclick="openSectionModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg> Раздел</button></nav>
  <div class="toolbar sidetools">
    <button class="btn" onclick="exportData()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>
      Сохранить в файл
    </button>
    <button class="btn" onclick="document.getElementById(&#39;imp&#39;).click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M17 8l-5-5-5 5"></path><path d="M12 3v12"></path></svg>
      Загрузить из файла

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.26A8 8 0 1 0 3 16.3"></path><path d="M12 12v9"></path><path d="m8 17 4 4 4-4"></path></svg>
      <span class="slabel">Всё сохранено</span>
    </button>
    <button class="btn" onclick="openPlan()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18M8 15l2 2 4-4"></path></svg>
      План
    </button>
    <button class="btn" onclick="openReport2()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 15v3M12 10v8M17 6v12"></path></svg>
      Отчёт
    </button>
  </div>
  <div class="note-line">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
    Данные сохраняются автоматически в браузере. Кнопка «Сохранить в файл» делает копию для iCloud / Google Drive.
  </div>
</aside>
<div class="wrap">
  
  <main id="view"></main>
</div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
